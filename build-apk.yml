name: Build AI Camera APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname "settings.gradle.kts")"
          echo "" | base64 -d > "settings.gradle.kts"
          mkdir -p "$(dirname "build.gradle.kts")"
          echo "cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQp9Cg==" | base64 -d > "build.gradle.kts"
          mkdir -p "$(dirname "gradle.properties")"
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgzZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg==" | base64 -d > "gradle.properties"
          mkdir -p "$(dirname "app/build.gradle.kts")"
          echo "" | base64 -d > "app/build.gradle.kts"
          mkdir -p "$(dirname "app/src/main/res/values/strings.xml")"
          echo "PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5BSSBDYW1lcmE8L3N0cmluZz48L3Jlc291cmNlcz4=" | base64 -d > "app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "app/src/main/res/values/themes.xml")"
          echo "" | base64 -d > "app/src/main/res/values/themes.xml"
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          echo "" | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "$(dirname "app/src/main/java/com/example/aicamera/MainActivity.kt")"
          echo "" | base64 -d > "app/src/main/java/com/example/aicamera/MainActivity.kt"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            gradle assembleDebug --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-${{ inputs.build_type }}-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
